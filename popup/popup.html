<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AGENTS.md 对话导入器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand">
          <img class="logo" src="../assets/icons/icon-48.png" alt="">
          <div>
            <h1>AGENTS.md 导入器</h1>
            <p id="site-status" class="site-status">正在读取当前网站…</p>
          </div>
        </div>
        <button id="open-options" class="icon-button" type="button" title="管理配置" aria-label="管理配置">⚙</button>
      </header>

      <section class="profiles-section" aria-labelledby="profiles-title">
        <div class="section-heading">
          <h2 id="profiles-title">可用配置</h2>
          <span id="profile-count">0 条</span>
        </div>
        <div id="profile-list" class="profile-list"></div>
        <div id="empty-state" class="empty-state">
          <p>当前网站没有已启用的配置。</p>
          <button id="empty-add" class="button secondary" type="button">打开设置页</button>
        </div>
      </section>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <button id="import-all" class="button primary import-all" type="button">
        <span>全部插入</span>
        <span id="shortcut-value" class="shortcut">读取中…</span>
      </button>

      <div class="footer-row">
        <button id="shortcut-settings" class="text-button" type="button">浏览器快捷键</button>
        <span>仅写入输入框，不会自动发送</span>
      </div>
    </main>

    <script src="../lib/site-model.js"></script>
    <script src="../lib/profile-model.js"></script>
    <script src="../lib/profile-store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
