<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AGENTS.md 对话导入器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <img class="logo" src="../assets/icons/icon-48.png" alt="">
        <div>
          <h1>AGENTS.md 导入器</h1>
          <p id="site-status" class="site-status">正在读取当前网站…</p>
        </div>
      </header>

      <section class="binding-card" aria-labelledby="global-title">
        <div class="binding-heading">
          <div>
            <h2 id="global-title">全局规范</h2>
            <p>所有支持的网站都会导入</p>
          </div>
          <span id="global-storage" class="status-pill">未保存</span>
        </div>
        <p id="global-file" class="file-name">尚未选择文件</p>
        <div class="button-row">
          <button id="global-choose" class="button secondary" type="button">选择文件</button>
          <button id="global-clear" class="button danger" type="button">清除</button>
        </div>
      </section>

      <section id="site-card" class="binding-card" aria-labelledby="site-title">
        <div class="binding-heading">
          <div>
            <h2 id="site-title">网站专属规范</h2>
            <p id="site-description">仅在当前网站追加导入</p>
          </div>
          <span id="site-storage" class="status-pill">未保存</span>
        </div>
        <p id="site-file" class="file-name">尚未选择文件</p>
        <div class="button-row">
          <button id="site-choose" class="button secondary" type="button">选择文件</button>
          <button id="site-clear" class="button danger" type="button">清除</button>
        </div>
      </section>

      <section class="shortcut-card" aria-labelledby="shortcut-title">
        <div>
          <h2 id="shortcut-title">导入快捷键</h2>
          <p>可在浏览器的扩展快捷键页面中修改</p>
        </div>
        <button id="shortcut-settings" class="button ghost" type="button">
          更改快捷键
        </button>
      </section>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <button id="import-button" class="button primary" type="button">
        导入到当前输入框
        <span id="shortcut-value" class="shortcut">读取中…</span>
      </button>

      <p class="privacy">文件正文保存在扩展本地；扩展不会自动发送消息。</p>
    </main>

    <script src="../lib/file-store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
